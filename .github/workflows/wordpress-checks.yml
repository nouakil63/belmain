name: WordPress — validation et archives

on:
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: Syntaxe PHP / JavaScript et ZIP installables
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier les outils disponibles
        run: |
          php --version
          node --version
          python3 --version

      - name: Vérifier la syntaxe PHP
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.php' -print0)
          test "$count" -gt 0

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.js' -print0)
          test "$count" -gt 0

      - name: Vérifier le déploiement sur une boutique factice isolée
        run: |
          python3 -m py_compile wordpress/tools/deploy-pull.py
          python3 wordpress/tests/deploy-pull-test.py
          php wordpress/tests/deploy-runtime-test.php

      - name: Produire et vérifier les archives
        run: python3 wordpress/tools/package-release.py --output-dir artifacts/wordpress

      - name: Conserver les archives pendant sept jours
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belmains-wordpress-${{ github.sha }}
          path: |
            artifacts/wordpress/*.zip
            artifacts/wordpress/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false

  publish-validated-packages:
    name: Publier les archives validées pour Infomaniak
    needs: validate-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/version-3-bordeaux'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Télécharger uniquement les archives de cette exécution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belmains-wordpress-${{ github.sha }}
          path: artifacts/wordpress

      - name: Vérifier les empreintes et publier une livraison liée au commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        working-directory: artifacts/wordpress
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tag="belmains-deploy-$REVISION"
          if ! actual="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$REVISION" >/dev/null
            actual="$REVISION"
          fi
          test "$actual" = "$REVISION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --target "$REVISION" --draft --prerelease \
              --title "Belmains $REVISION" --notes "Archives validées du commit $REVISION."
          fi
          gh release upload "$tag" ./*.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease
