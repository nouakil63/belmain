name: WordPress — validation et archives

on:
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: Syntaxe PHP / JavaScript et ZIP installables
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-belmain-only
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: belmains_validation
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="mariadb-admin ping --silent -h localhost -pci-belmain-only"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier les outils disponibles
        run: |
          php --version
          node --version
          python3 --version

      - name: Vérifier la syntaxe PHP
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.php' -print0)
          test "$count" -gt 0

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.js' -print0)
          test "$count" -gt 0

      - name: Vérifier le déploiement sur une boutique factice isolée
        run: |
          python3 -m py_compile wordpress/tools/deploy-pull.py
          python3 wordpress/tests/deploy-pull-test.py
          php wordpress/tests/deploy-runtime-test.php

      - name: Vérifier la galerie et la fermeture sur WordPress isolé
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'
          runtime="$RUNNER_TEMP/belmains-validation"
          mkdir -p "$runtime/site" artifacts/gallery
          curl --fail --location --retry 3 --output "$runtime/wp-cli.phar" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          wp() { php "$runtime/wp-cli.phar" --path="$runtime/site" "$@"; }
          wp core download --version=7.1.3 --force
          wp config create --dbname=belmains_validation --dbuser=root --dbpass=ci-belmain-only --dbhost=127.0.0.1:3306 --dbprefix=bcrm_validation_ --extra-php <<'PHP'
          define('WP_ENVIRONMENT_TYPE', 'local');
          define('WP_HTTP_BLOCK_EXTERNAL', true);
          define('DISABLE_WP_CRON', true);
          define('WP_AUTO_UPDATE_CORE', false);
          define('WP_CACHE', false);
          PHP
          mkdir -p "$runtime/site/wp-content/mu-plugins"
          cat > "$runtime/site/wp-content/mu-plugins/isolated-validation.php" <<'PHP'
          <?php
          add_filter('pre_wp_mail', '__return_false', PHP_INT_MAX);
          add_filter('pre_http_request', static function ($pre, $args, $url) { file_put_contents(WP_CONTENT_DIR . '/http-attempts.log', $url . "\n", FILE_APPEND | LOCK_EX); return new WP_Error('isolated_validation', 'External HTTP blocked.'); }, PHP_INT_MAX, 3);
          add_filter('automatic_updater_disabled', '__return_true');
          add_filter('action_scheduler_allow_async_request_runner', '__return_false');
          PHP
          wp core install --url=http://127.0.0.1:8899 --title='Belmains validation' --admin_user=validation_admin --admin_password=ci-validation-only --admin_email=validation@example.invalid --skip-email
          curl --fail --location --retry 3 --output "$runtime/woocommerce.zip" https://downloads.wordpress.org/plugin/woocommerce.11.1.2.zip
          unzip -q "$runtime/woocommerce.zip" -d "$runtime/site/wp-content/plugins"
          cp -R wordpress/belmains "$runtime/site/wp-content/themes/"
          cp -R wordpress/belmains-commerce wordpress/belmains-crm "$runtime/site/wp-content/plugins/"
          wp plugin activate woocommerce belmains-commerce belmains-crm
          wp theme activate belmains
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/gallery-access-integration.php" | tee artifacts/gallery/gallery-access-checks.txt
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/catalog-integration.php" | tee artifacts/gallery/catalog-checks.txt
          # Extension officielle Meta, version et empreinte figées : le verrou de consentement du CRM est validé contre elle.
          curl --fail --location --retry 3 --output "$runtime/meta-for-woocommerce.zip" https://downloads.wordpress.org/plugin/facebook-for-woocommerce.3.7.9.zip
          echo "4b7ec01889dd3ba8e1a530b0f6f2992550d3b272de943feb3062dfdaa1dd128b  $runtime/meta-for-woocommerce.zip" | sha256sum --check
          unzip -q "$runtime/meta-for-woocommerce.zip" -d "$runtime/site/wp-content/plugins"
          wp plugin activate facebook-for-woocommerce
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/meta-integration.php" | tee artifacts/gallery/meta-checks.txt
          grep -q 'Meta gate checks passed with the official extension' artifacts/gallery/meta-checks.txt
          # Ouverture des ventes : rejouée sur cette copie isolée avec un état de déploiement jetable.
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/open-shop-integration.php" | tee artifacts/gallery/open-shop-checks.txt
          grep -q 'opening checks passed' artifacts/gallery/open-shop-checks.txt
          # Rétractation en ligne et textes légaux : rejoués sur les mêmes tables isolées, sans envoi d'e-mail réel.
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/withdrawal-integration.php" | tee artifacts/gallery/withdrawal-checks.txt
          grep -q 'withdrawal checks passed' artifacts/gallery/withdrawal-checks.txt
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/legal-pages-integration.php" | tee artifacts/gallery/legal-pages-checks.txt
          grep -q 'legal page checks passed' artifacts/gallery/legal-pages-checks.txt
          # Page de commande unique : quantité, retrait et panier vide, sur un produit jetable.
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/order-page-integration.php" | tee artifacts/gallery/order-page-checks.txt
          grep -q 'order page checks passed' artifacts/gallery/order-page-checks.txt
          # Photo des e-mails de commande : copie opaque d'une image détourée.
          wp --user=validation_admin eval-file "$GITHUB_WORKSPACE/wordpress/tests/email-picture-integration.php" | tee artifacts/gallery/email-picture-checks.txt
          grep -q 'e-mail picture checks passed' artifacts/gallery/email-picture-checks.txt
          wp option update wc_facebook_pixel_id 123456789012345
          wp option update facebook_config '{"pixel_id":"123456789012345"}' --format=json
          wp option update wc_facebook_access_token ci-validation-only
          wp eval '$id=wp_insert_post(array("post_type"=>"page","post_status"=>"publish","post_title"=>"Galerie","post_name"=>"galerie"),true); if(is_wp_error($id)){throw new RuntimeException($id->get_error_message());} update_post_meta($id,"_wp_page_template","page-galerie.php"); update_option("belmains_gallery_page_id",$id);'
          wp rewrite structure '/%postname%/'
          cat > "$runtime/router.php" <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if ('/' !== $path && is_file(__DIR__ . '/site' . $path)) { return false; }
          require __DIR__ . '/site/index.php';
          PHP
          php -S 127.0.0.1:8899 -t "$runtime/site" "$runtime/router.php" > "$runtime/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          # Boutique ouverte : l'extension Meta ne s'exprime et n'émet qu'avec l'accord publicitaire.
          attempts="$runtime/site/wp-content/http-attempts.log"
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8899/ --output artifacts/gallery/open-no-answer.html; then break; fi
            sleep 1
          done
          test -s artifacts/gallery/open-no-answer.html
          : > "$attempts"
          curl --fail --silent http://127.0.0.1:8899/ --output artifacts/gallery/open-no-answer.html
          curl --fail --silent --cookie 'bcrm_ads=no' http://127.0.0.1:8899/ --output artifacts/gallery/open-refused.html
          if grep -qi 'facebook' "$attempts"; then echo 'Meta was contacted without the advertising accord.'; exit 1; fi
          curl --fail --silent --cookie 'bcrm_ads=yes' --user-agent 'Mozilla/5.0 (validation)' --dump-header artifacts/gallery/open-accepted.headers http://127.0.0.1:8899/ --output artifacts/gallery/open-accepted.html
          grep -q '^https://graph\.facebook\.com/.*/123456789012345/events' "$attempts"
          grep -qi '^cache-control: private' artifacts/gallery/open-accepted.headers
          python3 - <<'PY'
          from pathlib import Path
          import re
          meta = re.compile(r'fbevents|facebook\.net|facebook\.com|wc-facebook|FacebookSignals|123456789012345')
          for name in ('open-no-answer', 'open-refused'):
              page = Path(f'artifacts/gallery/{name}.html').read_text()
              assert not meta.search(page), name
              assert 'BelmainsAudience' in page and 'data-bcrm-purpose="ads"' in page, name
          accepted = Path('artifacts/gallery/open-accepted.html').read_text()
          assert 'connect.facebook.net/en_US/fbevents.js' in accepted and '123456789012345' in accepted
          print('Open shop: official Meta extension silent without the accord, running with it.')
          PY
          # Vitrine d'avant ouverture : tout reste fermé, même avec un accord.
          cp wordpress/tools/public-catalog-guard.php "$runtime/site/wp-content/mu-plugins/belmains-staging-guard.php"
          : > "$attempts"
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8899/galerie/ --output artifacts/gallery/gallery-preview.html; then break; fi
            sleep 1
          done
          test -s artifacts/gallery/gallery-preview.html
          curl --fail --silent http://127.0.0.1:8899/ --output artifacts/gallery/front-preview.html
          curl --fail --silent --cookie 'bcrm_ads=yes' --user-agent 'Mozilla/5.0 (validation)' http://127.0.0.1:8899/ --output artifacts/gallery/front-accepted-closed.html
          if grep -qi 'facebook' "$attempts"; then echo 'Meta was contacted behind the protected catalogue.'; exit 1; fi
          test "$(curl --silent --output artifacts/gallery/rest-closure.json --write-out '%{http_code}' http://127.0.0.1:8899/wp-json/)" = 503
          grep -q belmains_preparation artifacts/gallery/rest-closure.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8899/checkout/)" = 302
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('artifacts/gallery/gallery-preview.html').read_text()
          assert len(re.findall(r'<video\b', html)) == 3
          assert not re.search(r'<video\b[^>]*\bautoplay\b', html)
          assert all(name + '.mp4' in html for name in ('belmains-decouverte', 'belmains-quotidien', 'belmains-rituel'))
          assert 'aria-current="page">Galerie</a>' in html
          front = Path('artifacts/gallery/front-preview.html').read_text()
          assert 'Galerie</a>' in front
          accepted = Path('artifacts/gallery/front-accepted-closed.html').read_text()
          assert not re.search(r'BelmainsAudience|bcrm-consent|fbevents|facebook\.net|facebook\.com|wc-facebook|FacebookSignals|123456789012345', front + html + accepted)
          print('HTTP gallery, navigation, native players, catalog closure and closed Meta extension passed.')
          PY

      - name: Conserver les aperçus et contrôles de galerie
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belmains-gallery-preview-${{ github.sha }}
          path: artifacts/gallery/
          retention-days: 7
          if-no-files-found: error

      - name: Produire et vérifier les archives
        run: python3 wordpress/tools/package-release.py --output-dir artifacts/wordpress

      - name: Conserver les archives pendant sept jours
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belmains-wordpress-${{ github.sha }}
          path: |
            artifacts/wordpress/*.zip
            artifacts/wordpress/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false

  publish-validated-packages:
    name: Publier les archives validées pour Infomaniak
    needs: validate-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/version-3-bordeaux'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Télécharger uniquement les archives de cette exécution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belmains-wordpress-${{ github.sha }}
          path: artifacts/wordpress

      - name: Vérifier les empreintes et publier une livraison liée au commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        working-directory: artifacts/wordpress
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tag="belmains-deploy-$REVISION"
          if ! actual="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$REVISION" >/dev/null
            actual="$REVISION"
          fi
          test "$actual" = "$REVISION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --target "$REVISION" --draft --prerelease \
              --title "Belmains $REVISION" --notes "Archives validées du commit $REVISION."
          fi
          gh release upload "$tag" ./*.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease
