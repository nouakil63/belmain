name: WordPress — validation et archives

on:
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Syntaxe PHP / JavaScript et ZIP installables
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier les outils disponibles
        run: |
          php --version
          node --version
          python3 --version

      - name: Vérifier la syntaxe PHP
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.php' -print0)
          test "$count" -gt 0

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find wordpress -type f -name '*.js' -print0)
          test "$count" -gt 0

      - name: Produire et vérifier les archives
        run: python3 wordpress/tools/package-release.py --output-dir artifacts/wordpress

      - name: Conserver les archives pendant sept jours
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belmains-wordpress-${{ github.sha }}
          path: |
            artifacts/wordpress/*.zip
            artifacts/wordpress/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
